<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deniz Canlıları — Deniz Akademisi</title>
<style>
:root{--ocean:#0077b6;--deep:#023e8a;--mint:#00F5D4;--sun:#FFD700;--orange:#FF6B35;--dark:#0D2137;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(180deg,#010d1f,#023e8a);color:#fff;min-height:100vh;}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;}}

nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;background:rgba(0,0,0,.3);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;}
nav a{color:rgba(255,255,255,.8);text-decoration:none;font-size:.85rem;font-weight:600;}
.back{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);padding:.4rem .9rem;border-radius:50px;}

.wrap{max-width:820px;margin:0 auto;padding:2rem 1.5rem;}
.title{text-align:center;margin-bottom:1.75rem;}
.title h1{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:900;margin-bottom:.4rem;}
.title p{color:rgba(255,255,255,.6);font-size:.88rem;}

/* Mode toggle */
.mode-row{display:flex;gap:.75rem;justify-content:center;margin-bottom:1.75rem;}
.mode-btn{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);color:rgba(255,255,255,.65);border-radius:50px;padding:.5rem 1.2rem;font-size:.8rem;font-weight:700;cursor:pointer;transition:all .2s;}
.mode-btn.active{background:rgba(0,245,212,.15);border-color:rgba(0,245,212,.4);color:var(--mint);}

/* ANIMAL CARDS */
.animals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.25rem;}
.animal-card{
  background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);
  border-radius:22px;overflow:hidden;cursor:pointer;transition:all .3s;
}
.animal-card:hover,.animal-card.active{border-color:rgba(0,245,212,.4);transform:translateY(-4px);box-shadow:0 16px 36px rgba(0,0,0,.3);}
.card-top{height:150px;display:flex;align-items:center;justify-content:center;font-size:5rem;position:relative;overflow:hidden;}
.card-top::after{content:'';position:absolute;bottom:0;left:0;right:0;height:40%;background:linear-gradient(0deg,rgba(0,0,0,.35),transparent);}
.card-tag{position:absolute;top:.6rem;right:.6rem;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:.25rem .6rem;border-radius:50px;z-index:1;}
.tag-koruma{background:rgba(231,76,60,.25);color:#e74c3c;border:1px solid rgba(231,76,60,.4);}
.tag-yaygın{background:rgba(39,174,96,.2);color:#2ecc71;border:1px solid rgba(39,174,96,.3);}
.tag-nadir{background:rgba(255,214,0,.15);color:var(--sun);border:1px solid rgba(255,214,0,.3);}
.card-body{padding:1.1rem;}
.card-name{font-size:.95rem;font-weight:900;margin-bottom:.15rem;}
.card-sciname{font-size:.7rem;color:rgba(255,255,255,.4);font-style:italic;margin-bottom:.5rem;}
.card-fact{font-size:.8rem;color:rgba(255,255,255,.65);line-height:1.65;}

/* Detail modal */
.detail-wrap{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;overflow-y:auto;backdrop-filter:blur(8px);}
.detail-box{max-width:560px;margin:2rem auto;background:linear-gradient(180deg,#012040,#023e8a);border:1.5px solid rgba(0,245,212,.3);border-radius:28px;overflow:hidden;}
.detail-header{padding:2rem 2rem 1.25rem;display:flex;gap:1rem;align-items:flex-start;}
.detail-emoji{font-size:4rem;flex-shrink:0;}
.detail-info{flex:1;}
.detail-name{font-size:1.35rem;font-weight:900;margin-bottom:.2rem;}
.detail-sciname{font-size:.78rem;color:rgba(255,255,255,.45);font-style:italic;margin-bottom:.6rem;}
.detail-status{display:inline-block;font-size:.7rem;font-weight:700;padding:.25rem .75rem;border-radius:50px;margin-bottom:.6rem;}
.detail-desc{font-size:.87rem;color:rgba(255,255,255,.75);line-height:1.8;}
.detail-body{padding:0 2rem 2rem;display:flex;flex-direction:column;gap:1rem;}
.detail-facts{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
.fact-pill{background:rgba(255,255,255,.07);border-radius:12px;padding:.75rem 1rem;}
.fact-label{font-size:.65rem;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.4);margin-bottom:.25rem;}
.fact-val{font-size:.88rem;font-weight:800;}
.threat-box{background:rgba(231,76,60,.08);border:1px solid rgba(231,76,60,.25);border-radius:12px;padding:1rem;}
.threat-title{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#e74c3c;margin-bottom:.4rem;}
.threat-text{font-size:.82rem;color:rgba(255,255,255,.65);line-height:1.65;}
.eco-box{background:rgba(0,245,212,.07);border:1px solid rgba(0,245,212,.2);border-radius:12px;padding:1rem;}
.eco-title{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--mint);margin-bottom:.4rem;}
.eco-text{font-size:.82rem;color:rgba(255,255,255,.65);line-height:1.65;}
.close-btn{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:0 0 28px 28px;padding:1rem;font-weight:700;cursor:pointer;font-size:.88rem;transition:background .2s;}
.close-btn:hover{background:rgba(255,255,255,.15);}

/* QUIZ */
#quizPanel{display:none;}
.quiz-q{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);border-radius:18px;padding:1.5rem;margin-bottom:1rem;}
.quiz-q h3{font-size:.95rem;font-weight:800;margin-bottom:1rem;}
.quiz-emoji{font-size:3.5rem;text-align:center;margin-bottom:.75rem;display:block;}
.quiz-opts{display:flex;flex-direction:column;gap:.6rem;}
.qopt{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);border-radius:12px;padding:.85rem 1.1rem;font-size:.85rem;font-weight:700;cursor:pointer;text-align:left;color:#fff;transition:all .2s;}
.qopt:hover:not([disabled]){background:rgba(255,255,255,.12);}
.qopt.correct{background:rgba(0,245,212,.15);border-color:rgba(0,245,212,.5);color:var(--mint);}
.qopt.wrong{background:rgba(231,76,60,.12);border-color:rgba(231,76,60,.4);color:#e74c3c;}

/* Win */
#winPanel{display:none;text-align:center;background:rgba(0,245,212,.08);border:2px solid rgba(0,245,212,.3);border-radius:20px;padding:2.5rem;margin-top:1.5rem;}
#winPanel h2{color:var(--mint);font-size:1.7rem;margin-bottom:.4rem;}
.btn-nxt{display:inline-block;background:linear-gradient(135deg,var(--orange),var(--sun));color:var(--dark);padding:.85rem 2rem;border-radius:50px;text-decoration:none;font-weight:800;}
</style>
</head>
<body>

  <a href="/" class="nav-logo" style="display:flex;align-items:center;gap:.55rem;text-decoration:none;">
    <svg width="34" height="38" viewBox="0 0 105 115" xmlns="http://www.w3.org/2000/svg">

        <linearGradient id="nl1" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#152f88"/><stop offset="40%" stop-color="#60b0f0"/><stop offset="100%" stop-color="#1a3a8f"/></linearGradient>

  <button class="ham" id="ham" onclick="toggleNav()" aria-label="Menü" aria-expanded="false">☰</button>

<div class="wrap">
  <div class="title">
    <h1>🐬 Deniz Canlıları</h1>
    <p>Akdeniz'in harika sakinlerini tanı, koru!</p>
  </div>

  <div class="mode-row">
    <button class="mode-btn active" onclick="setMode('keşif',this)">🔍 Keşfet</button>
    <button class="mode-btn" onclick="setMode('quiz',this)">🧠 Quiz</button>
  </div>

  <div id="keşifPanel">
    <div class="animals-grid" id="animalsGrid"></div>
  </div>

  <div id="quizPanel">
    <div id="quizContent"></div>
  </div>

  <div id="winPanel">
    <h2>🐬 Deniz Dostu!</h2>
    <p>Akdeniz'in canlılarını tanıyorsun! <strong>Deniz Dostu</strong> rozetini kazandın!</p>
    <a href="/" class="btn-nxt">🏅 Tüm Rozetlere →</a>
  </div>
</div>

<!-- Detail modal -->
<div class="detail-wrap" id="detailWrap" onclick="closeDetail(event)">
  <div class="detail-box" id="detailBox"></div>
</div>

<script>
const ANIMALS=[
  {
    emoji:'🐢',name:'Caretta Caretta',sciname:'Caretta caretta',tag:'Koruma altında',tagCls:'tag-koruma',
    color:'linear-gradient(135deg,#1d6a3a,#27ae60)',
    fact:'Nesli tehlike altında! Mersin\'deki kumsallar yumurtlama alanı.',
    desc:'Caretta caretta, Akdeniz\'in en önemli sembol deniz kaplumbağasıdır. Mersin'deki birçok kumsal, bu muhteşem yaratıkların yumurtlama alanı olup koruma altındadır.',
    size:'70-95 cm',ömür:'40-60 yıl',derinlik:'Yüzey – 200 m',beslenme:'Denizanası, kabuklu deniz hayvanları',
    tehdit:'Plastik kirliliği (denizanası sanılarak yutulur), ışık kirliliği yeni doğanları şaşırtır, av ağlarına takılma.',
    eko:'Deniz bitkisi tarlalarını temizler, denizanası nüfusunu dengeler. Çok kritik bir tür!'
  },
  {
    emoji:'🐬',name:'Akdeniz Yunusu',sciname:'Delphinus delphis',tag:'Yaygın',tagCls:'tag-yaygın',
    color:'linear-gradient(135deg,#0077b6,#00b4d8)',
    fact:'Teknelerin önünde sörf yapar! IQ\'su çok yüksek.',
    desc:'Akdeniz yunusları, Mersin kıyılarında sık görülen sosyal memelilerdir. Grup halinde avlanır, birbirlerine "isim" sesi çıkararak iletişim kurarlar.',
    size:'1.7-2.2 m',ömür:'35-40 yıl',derinlik:'Yüzey – 200 m',beslenme:'Balık, kalamar',
    tehdit:'Av ağlarına takılma, deniz kirliliği, gürültü kirliliği ekolokasyonu bozar.',
    eko:'Balık popülasyonunu dengeler. Yunus araştırmaları okyanus sağlığını izlememize yardımcı olur.'
  },
  {
    emoji:'🦑',name:'Ahtapot',sciname:'Octopus vulgaris',tag:'Yaygın',tagCls:'tag-yaygın',
    color:'linear-gradient(135deg,#7b2d8b,#9b59b6)',
    fact:'3 kalbi, 8 "kolu" ve mavi kanı var!',
    desc:'Ahtapotlar, zekaları ile ünlü yumuşakçalardır. Renk körü olmalarına rağmen camuflaj yapabilir, kapları açabilir ve hatta araç kullanabilirler!',
    size:'30-90 cm (kollar dahil)',ömür:'1-2 yıl',derinlik:'0 – 150 m',beslenme:'Yengeç, kabuklu deniz hayvanları, balık',
    tehdit:'Aşırı avlanma, habitat bozulması.',
    eko:'Av ve av olan — ekosistemde orta halkada kritik rol oynar.'
  },
  {
    emoji:'🦀',name:'Akdeniz Yengeci',sciname:'Cancer pagurus',tag:'Yaygın',tagCls:'tag-yaygın',
    color:'linear-gradient(135deg,#c0392b,#e74c3c)',
    fact:'Kabuğu çatladığında yenisini yapar — tam bir süper güç!',
    desc:'Yengeçler Akdeniz\'in dip sakinleridir. Kıskaçları hem savunma hem yiyecek yakalamak için kullanılır. Sağ ve sol kıskaç farklı işler yapar!',
    size:'5-15 cm',ömür:'5-10 yıl',derinlik:'0 – 100 m',beslenme:'Alg, yumuşakça, organik atık',
    tehdit:'Plastik ve kimyasal kirlilik, habitat bozulması.',
    eko:'Deniz tabanı temizleyicisi. Ölü organik maddeyi parçalayarak deniz dengesine katkı sağlar.'
  },
  {
    emoji:'🐟',name:'Çupra (Seyrek Göz)',sciname:'Sparus aurata',tag:'Nadir azalan',tagCls:'tag-nadir',
    color:'linear-gradient(135deg,#2471a3,#1a7a4a)',
    fact:'İki cinsiyetle başlıyor: önce erkek, sonra dişi oluyor!',
    desc:'Çupra Akdeniz\'in en tanınan balığıdır. İki gözü arasındaki altın şerit ile tanınır. Proteinden zengin, lezzetli eti nedeniyle aşırı avlanma baskısı altındadır.',
    size:'25-55 cm',ömür:'11 yıl',derinlik:'1 – 150 m',beslenme:'Yumuşakça, kabuklu deniz hayvanları, balık',
    tehdit:'Aşırı avlanma, su sıcaklığı artışı, kirlilik.',
    eko:'Kayalık habitatlar için önemli. Levrek ve çupra av yasakları ekosistemi koruyor.'
  },
  {
    emoji:'🪸',name:'Akdeniz Sığırotu',sciname:'Posidonia oceanica',tag:'Koruma altında',tagCls:'tag-koruma',
    color:'linear-gradient(135deg,#1d6a3a,#0b8a4a)',
    fact:'Dünya\'nın en eski canlısı olabilir — 100.000 yıldan eski koloniler keşfedildi!',
    desc:'Sığırotu (Posidonia) bir yosun değil, gerçek bir çiçekli bitkidir! Akdeniz\'in "akciğerleri" olarak bilinir — oksijen üretir ve milyonlarca canlıya ev sahipliği yapar.',
    size:'50-100 cm yaprak',ömür:'Yüzyıllar - binyıllar',derinlik:'1 – 40 m',beslenme:'Fotosentez (bitki)',
    tehdit:'Tekne demiri, kirlilik, deniz ısınması, istilacı türler.',
    eko:'Oksijen fabrikası, balık kreşi, kıyı koruyucusu. Bir m² sığırotu günde 10 litre O₂ üretir!'
  },
  {
    emoji:'🦈',name:'Kadife Balığı (Akula)',sciname:'Mustelus mustelus',tag:'Nadir azalan',tagCls:'tag-nadir',
    color:'linear-gradient(135deg,#555,#777)',
    fact:'Akdeniz köpek balıkları insanlara saldırmaz — aksine, çoğu zararsız ve korkakdır!',
    desc:'Akdeniz\'de birçok köpekbalığı türü yaşar, en yaygını kadife balığıdır. Sıradan köpek balıklarından farklı olarak yumuşak dişleri ve zararsız yapısıyla bilinir.',
    size:'100-150 cm',ömür:'20-25 yıl',derinlik:'Yüzey – 200 m',beslenme:'Kabuklu deniz hayvanları, yengeç, balık',
    tehdit:'Aşırı avlanma (yüzgeçleri için), iklim değişikliği.',
    eko:'Denge sağlayıcı apex predatör. Köpekbalıkları olmadan deniz ekosistemleri çöker!'
  },
  {
    emoji:'🦩',name:'Akdeniz Fokü',sciname:'Monachus monachus',tag:'Koruma altında',tagCls:'tag-koruma',
    color:'linear-gradient(135deg,#7f8c8d,#bdc3c7)',
    fact:'Dünyada yaklaşık 700 bireyden az kaldı — Akdeniz\'in en tehlikede olan memelisi!',
    desc:'Akdeniz foku, dünyanın en tehlike altındaki fok türlerinden biridir. Türkiye\'de ege kıyılarında az sayıda yaşamaktadır.',
    size:'2.4-2.8 m',ömür:'20-25 yıl',derinlik:'Genellikle kıyısal',beslenme:'Balık, ahtapot',
    tehdit:'Yasadışı avlanma, turizm baskısı, av ağları, yaşam alanı kaybı.',
    eko:'Akdeniz\'in sembol türü. Fok varsa ekosistem sağlıklı demektir!'
  },
];

let viewedAnimals=new Set();
let badgeGiven=false;
let currentMode='keşif';

function renderCards(){
  const grid=document.getElementById('animalsGrid');
  grid.innerHTML=ANIMALS.map((a,i)=>`
    <div class="animal-card" onclick="openDetail(${i})">
      <div class="card-top" style="background:${a.color}">
        ${a.emoji}
        <span class="card-tag ${a.tagCls}">${a.tag}</span>
      </div>
      <div class="card-body">
        <div class="card-name">${a.name}</div>
        <div class="card-sciname">${a.sciname}</div>
        <div class="card-fact">${a.fact}</div>
      </div>
    </div>
  `).join('');
}

function openDetail(idx){
  const a=ANIMALS[idx];
  viewedAnimals.add(idx);
  if(viewedAnimals.size>=5&&!badgeGiven){
    badgeGiven=true;
    localStorage.setItem('badge_deniz_canlilari','1');
    setTimeout(()=>{
      document.getElementById('winPanel').style.display='block';
      document.getElementById('winPanel').scrollIntoView({behavior:'smooth'});
    },600);
  }
  document.getElementById('detailBox').innerHTML=`
    <div class="detail-header">
      <span class="detail-emoji">${a.emoji}</span>
      <div class="detail-info">
        <div class="detail-name">${a.name}</div>
        <div class="detail-sciname">${a.sciname}</div>
        <span class="detail-status ${a.tagCls}" style="background:transparent;border:1px solid">${a.tag}</span>
        <div class="detail-desc" style="margin-top:.6rem">${a.desc}</div>
      </div>
    </div>
    <div class="detail-body">
      <div class="detail-facts">
        <div class="fact-pill"><div class="fact-label">Boyut</div><div class="fact-val">${a.size}</div></div>
        <div class="fact-pill"><div class="fact-label">Ömür</div><div class="fact-val">${a.ömür}</div></div>
        <div class="fact-pill"><div class="fact-label">Derinlik</div><div class="fact-val">${a.derinlik}</div></div>
        <div class="fact-pill"><div class="fact-label">Beslenme</div><div class="fact-val" style="font-size:.75rem">${a.beslenme}</div></div>
      </div>
      <div class="threat-box">
        <div class="threat-title">⚠️ Tehditler</div>
        <div class="threat-text">${a.tehdit}</div>
      </div>
      <div class="eco-box">
        <div class="eco-title">🌊 Ekosistem Rolü</div>
        <div class="eco-text">${a.eko}</div>
      </div>
    </div>
    <button class="close-btn" onclick="document.getElementById('detailWrap').style.display='none'">× Kapat</button>
  `;
  document.getElementById('detailWrap').style.display='block';
  document.body.style.overflow='hidden';
}

function closeDetail(e){
  if(e.target===document.getElementById('detailWrap')){
    document.getElementById('detailWrap').style.display='none';
    document.body.style.overflow='';
  }
}

// QUIZ
const QUIZ=[
  {q:'Caretta caretta neden tehlike altında?',emoji:'🐢',opts:['Çok hızlı yüzüyor','Plastik kirliliği ve ışık kirliliği','Balık yemiyor','Yüzey geçemiyor'],ans:1},
  {q:'Akdeniz yunusları nasıl iletişim kurar?',emoji:'🐬',opts:['Renkle','İşaretle','Ses ile, her birinin "adı" var','Titreşimle'],ans:2},
  {q:'Ahtapotun kaç kalbi var?',emoji:'🦑',opts:['1','2','3','4'],ans:2},
  {q:'Sığırotu (Posidonia) aslında ne?',emoji:'🪸',opts:['Yosun','Alg','Çiçekli bitki','Mercan'],ans:2},
  {q:'Hangi Akdeniz canlısı "Akdeniz\'in akciğerleri" olarak bilinir?',emoji:'🌊',opts:['Caretta','Yunus','Sığırotu','Ahtapot'],ans:2},
  {q:'Çupra balığı hayatı boyunca cinsiyetini değiştirir — önce ne?',emoji:'🐟',opts:['Dişi','Erkek','Her ikisi aynı anda','Cinsiyetsiz'],ans:1},
  {q:'Akdeniz foku dünyada kaç tane kaldı (yaklaşık)?',emoji:'🦩',opts:['700\'den az','7.000','70.000','700.000'],ans:0},
];

let qIdx=0,qScore=0;

function buildQuiz(){
  const q=QUIZ[qIdx];
  document.getElementById('quizContent').innerHTML=`
    <div class="quiz-q">
      <span class="quiz-emoji">${q.emoji}</span>
      <h3>Soru ${qIdx+1}/${QUIZ.length}: ${q.q}</h3>
      <div class="quiz-opts">
        ${q.opts.map((o,i)=>`<button class="qopt" onclick="answerQ(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}
      </div>
    </div>
    <div style="text-align:center;font-size:.82rem;color:rgba(255,255,255,.4)">⭐ Puan: ${qScore} / ${qIdx*10}</div>
  `;
}

function answerQ(idx){
  const q=QUIZ[qIdx];
  document.querySelectorAll('.qopt').forEach((o,i)=>{
    o.disabled=true;
    if(i===q.ans)o.classList.add('correct');
    else if(i===idx&&idx!==q.ans)o.classList.add('wrong');
  });
  if(idx===q.ans)qScore+=10;
  setTimeout(()=>{
    qIdx++;
    if(qIdx>=QUIZ.length){
      if(qScore>=50&&!badgeGiven){
        badgeGiven=true;
        localStorage.setItem('badge_deniz_canlilari','1');
        document.getElementById('winPanel').style.display='block';
      }
      document.getElementById('quizContent').innerHTML=`
        <div class="quiz-q" style="text-align:center">
          <div style="font-size:3rem;margin-bottom:.75rem">🎉</div>
          <h3>Quiz bitti!</h3>
          <p style="color:rgba(255,255,255,.6);margin:.5rem 0">Puan: <strong style="color:var(--sun)">${qScore} / ${QUIZ.length*10}</strong></p>
          <button class="qopt" onclick="qIdx=0;qScore=0;buildQuiz()" style="margin-top:1rem;text-align:center">🔄 Tekrar Oyna</button>
        </div>`;
      return;
    }
    buildQuiz();
  },1100);
}

function setMode(m,btn){
  currentMode=m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('keşifPanel').style.display=m==='keşif'?'block':'none';
  const qp=document.getElementById('quizPanel');
  if(m==='quiz'){qp.style.display='block';qIdx=0;qScore=0;buildQuiz();}
  else qp.style.display='none';
}

renderCards();
</script>
</body>
</html>
