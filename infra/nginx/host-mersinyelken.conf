server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name 46.224.26.120 mersinyelken.org.tr www.mersinyelken.org.tr;

    root /var/www/mersinyelken;
    index index.html;

    access_log /var/log/nginx/mersinyelken_web_access.log;
    error_log  /var/log/nginx/mersinyelken_web_error.log;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

server {

    server_name panel.mersinyelken.org.tr;

    client_max_body_size 15M;

    access_log /var/log/nginx/myk_panel_access.log;
    error_log  /var/log/nginx/myk_panel_error.log;

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/panel.mersinyelken.org.tr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/panel.mersinyelken.org.tr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = panel.mersinyelken.org.tr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name panel.mersinyelken.org.tr;
    return 404; # managed by Certbot


}