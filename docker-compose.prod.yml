# docker-compose.prod.yml — Production override
# Kullanım: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Gerekli: cp .env.production.example .env (ve gerçek değerleri doldur)

services:

  # ── Backend (FastAPI) — production build ────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production        # Dockerfile'daki "AS production" stage'i hedefler
    restart: always
    environment:
      MYK_ENV: production
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Object storage (.env'den okunur; production'da harici S3/Hetzner olabilir)
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-myk-person-media}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_SECURE: ${STORAGE_SECURE:-false}
      PDF_SERVICE_URL: http://pdf-service:8001
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      # SMTP değerleri production env-file'dan açıkça container'a aktarılır.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-noreply@mersinyelken.org.tr}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_START_TLS: ${SMTP_START_TLS:-true}
      # JWT_SECRET_KEY, SECRET_KEY, ALLOW_PUBLIC_SETUP vb. → env_file: .env
    volumes:
      # Production'da kaynak kod mount edilmez — sadece storage kalıcı
      - storage_data:/app/storage
    # Development'taki ./backend:/app volume kaldırıldı (base override)

  # ── Frontend — production build (Nginx) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production        # Vite build → Nginx static serving
    restart: always
    volumes: []                 # Development volume'larını kaldır

  # ── Nginx ───────────────────────────────────────────────────────────────────
  nginx:

    restart: always

    ports: !override

      - "18081:80"

    # Production SSL: Let's Encrypt sertifikaları kurulduktan sonra ekle:
    # volumes:
    #   - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    #   - /etc/letsencrypt:/etc/letsencrypt:ro
    # Aşama 3 altyapı sprint'inde HTTPS ve certbot entegrasyonu yapılacak.

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    restart: always
    # Production'da auth eklenebilir:
    # command: redis-server --requirepass ${REDIS_PASSWORD}

  # ── MinIO (Object Storage) ────────────────────────────────────────────────
  # Production'da MinIO yerine harici S3-uyumlu depolama tercih edilebilir.
  # MinIO kullanılıyorsa: port'lar host'a publish edilmez, sadece iç ağ.
  minio:
    restart: always
    ports: !override []         # Host'a port publish yok — tüm erişim iç ağ üzerinden

  # ── PDF Service ──────────────────────────────────────────────────────────
  pdf-service:
    restart: always
    # Port publish yok — yalnızca api → pdf-service:8001 iç ağ erişimi

  # ── ClamAV ───────────────────────────────────────────────────────────────
  clamav:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g   # 4 GB sunucuda ClamAV için üst sınır

  # ── Backend — ClamAV env'leri production'da da gerekli ───────────────────
  # (CLAMD_HOST zaten docker-compose.yml içinde tanımlı; override gerekmez)

volumes:
  postgres_data:
  redis_data:
  storage_data:
  minio_data:                   # Base compose'dan eksikti; production'da kalıcı
  clamav_data:                  # ClamAV imza veritabanı — yeniden indirmeyi önler

# ── Kullanım ──────────────────────────────────────────────────────────────────
# 1. cp .env.production.example .env
# 2. .env içindeki tüm REPLACE_WITH_* değerlerini gerçek değerlerle doldur
# 3. Syntax doğrula:
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml config
# 4. Build:
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml build --no-cache
# 5. Başlat:
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 6. Migration (--entrypoint /bin/sh yöntemi — myk_user DDL yetkisi gerektirir):
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#      run --rm -T --entrypoint /bin/sh api -c \
#      'export DATABASE_URL="postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
#       exec alembic -c migrations/alembic.ini upgrade head'
# 7. Doğrula:
#    docker compose exec api python -c "from app.config import get_settings; print(get_settings().myk_env)"
