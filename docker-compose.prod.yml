# docker-compose.prod.yml — Production override
# Kullanım: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Gerekli: cp .env.production.example .env (ve gerçek değerleri doldur)

services:

  # ── Backend (FastAPI) — production build ────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: always
    environment:
      MYK_ENV: production
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Aşağıdakiler .env dosyasından okunur (env_file: .env)
      # JWT_SECRET_KEY, SECRET_KEY, ALLOW_PUBLIC_SETUP=false vb.
    volumes:
      # Production'da kaynak kod mount edilmez — sadece storage kalıcı
      - storage_data:/app/storage
    # Development'taki ./backend:/app volume kaldırıldı

  # ── Frontend — production build (Nginx) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production    # Vite build → Nginx static serving (port 80)
    restart: always
    # Production'da Vite dev server yok; frontend container Nginx üzerinde 80'de çalışır
    # Ana nginx reverse proxy backend API'yi proxy'ler, frontend statik dosyaları serve eder
    volumes: []  # Development volume'ları kaldır

  # ── Nginx ───────────────────────────────────────────────────────────────────
  nginx:
    restart: always
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
    # Production SSL: volumes bölümüne Let's Encrypt sertifikaları eklenecek
    # - /etc/letsencrypt:/etc/letsencrypt:ro
    # Aşama 3 altyapı sprint'inde HTTPS ve certbot entegrasyonu yapılacak.

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    restart: always
    # Production'da redis auth eklenebilir: command: redis-server --requirepass ${REDIS_PASSWORD}

volumes:
  postgres_data:
  redis_data:
  storage_data:

# Kullanım notları:
# 1. cp .env.production.example .env
# 2. .env içindeki tüm REPLACE_WITH_* değerlerini gerçek değerlerle doldur
# 3. docker compose -f docker-compose.yml -f docker-compose.prod.yml config  # syntax doğrula
# 4. docker compose -f docker-compose.yml -f docker-compose.prod.yml build --no-cache
# 5. docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 6. docker compose exec api alembic upgrade head
# 7. docker compose exec api python -c "from app.config import get_settings; print(get_settings().myk_env)"
